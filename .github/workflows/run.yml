name: Telegram Userbot

on:
  workflow_dispatch:
    inputs:
      fresh_start:
        description: "पुराना सारा data/cache साफ़ करें"
        type: boolean
        default: true

permissions:
  contents: read
  actions: write   # cache delete करने के लिए

# पुराना run अपने आप cancel होकर नया चलेगा
concurrency:
  group: telegram-userbot
  cancel-in-progress: true

jobs:
  run-bot:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Clear old GitHub caches
        if: ${{ inputs.fresh_start }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh cache delete --all --repo ${{ github.repository }} || true

      - name: Clear old local data
        if: ${{ inputs.fresh_start }}
        run: |
          find . -type f \( -name "*.session" -o -name "*.session-journal" \
            -o -name "*.sqlite" -o -name "*.sqlite3" -o -name "*.db" \
            -o -name "*.pickle" \) -delete
          rm -rf data/ downloads/ temp/ __pycache__/ || true

      - name: Python setup
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install requirements
        run: pip install -r requirements.txt

      - name: Run bot
        env:
          API_ID: ${{ secrets.API_ID }}
          API_HASH: ${{ secrets.API_HASH }}
          STRING_SESSION: ${{ secrets.STRING_SESSION }}
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
        run: python bot.py
